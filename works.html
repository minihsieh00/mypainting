<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作品｜Niniz </title>
<meta name="description" content="Niniz的繪畫作品集">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
  /* ===== 顏色與字體：跟首頁一致 ===== */
  :root {
    --bg: #ffffff;
    --text: #1c1c1c;
    --muted: #8c8c8c;
    --line: #ebebeb;
    --accent: #b8612e;
    --serif: "Cormorant Garamond", "Noto Serif TC", serif;
    --serif-tc: "Noto Serif TC", serif;
    --sans: "Noto Sans TC", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--sans); font-weight: 300;
    line-height: 1.9; letter-spacing: .02em;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  img { display: block; -webkit-user-drag: none; user-select: none; mix-blend-mode: multiply; }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 56px; }

  /* ===== 導覽列 ===== */
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255,255,255,.94);
    backdrop-filter: blur(6px);
  }
  .nav { height: 88px; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: var(--serif); font-size: 1.6rem; font-weight: 500; letter-spacing: .12em; }
  .nav ul { list-style: none; display: flex; gap: 40px; }
  .nav ul a { font-size: .82rem; letter-spacing: .25em; color: var(--muted); transition: color .3s; }
  .nav ul a:hover, .nav ul a.on { color: var(--text); }

  /* ===== 標題 ===== */
  .page-head { padding-top: 72px; padding-bottom: 56px; }
  .page-head .en { font-family: var(--serif); font-style: italic; color: var(--muted); font-size: 1.1rem; }
  .page-head h1 {
    font-family: var(--serif-tc); font-weight: 400;
    font-size: clamp(1.6rem, 3vw, 2.2rem); letter-spacing: .3em; margin-top: 6px;
  }

  /* ===== 分類 ===== */
  .filters {
    display: flex; flex-wrap: wrap; gap: 32px;
    border-top: 1px solid var(--line); padding-top: 24px; margin-bottom: 72px;
  }
  .filters button {
    font: inherit; font-size: .85rem; letter-spacing: .2em;
    background: none; border: none; cursor: pointer;
    color: var(--muted); padding: 2px 0;
    border-bottom: 1px solid transparent; transition: all .3s;
  }
  .filters button:hover { color: var(--text); }
  .filters button.active { color: var(--text); border-bottom-color: var(--text); }
  .filters .count { font-family: var(--serif); font-size: .85rem; margin-left: 6px; }

  /* ===== 作品格 ===== */
  .gallery {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 88px 56px; padding-bottom: 160px;
  }
  .item { cursor: zoom-in; opacity: 0; transform: translateY(20px); animation: up 1s cubic-bezier(.2,.7,.2,1) forwards; }
  .item .frame { overflow: hidden; }
  .item img {
    width: 100%; aspect-ratio: 1; object-fit: contain;
    transition: transform 1s cubic-bezier(.2,.7,.2,1);
  }
  .item:hover img { transform: scale(1.035); }
  .item:hover .t { color: var(--accent); }
  .label { margin-top: 18px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  .label .no { font-family: var(--serif); font-size: .95rem; color: var(--muted); }
  .label .t { font-family: var(--serif-tc); font-size: .98rem; transition: color .3s; }
  .label .m { font-size: .78rem; color: var(--muted); letter-spacing: .12em; }
  @keyframes up { to { opacity: 1; transform: none; } }

  /* ===== 放大檢視（白色展間） ===== */
  .lightbox {
    position: fixed; inset: 0; z-index: 100; background: #fff;
    display: none; grid-template-columns: 1fr 300px; align-items: center;
    padding: 72px 64px; gap: 64px;
  }
  .lightbox.open { display: grid; animation: fade .4s ease; }
  @keyframes fade { from { opacity: 0; } }
  .lb-stage { height: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lb-info .no { font-family: var(--serif); color: var(--muted); font-size: 1rem; }
  .lb-info .t { font-family: var(--serif-tc); font-size: 1.5rem; font-weight: 400; letter-spacing: .12em; margin-top: 8px; }
  .lb-info .m { color: var(--muted); font-size: .85rem; letter-spacing: .12em; margin-top: 10px; }
  .lb-info .d { font-size: .92rem; color: #555; margin-top: 24px; }
  .lb-nav { display: flex; gap: 28px; margin-top: 48px; }
  .lb-btn {
    font: inherit; font-size: .8rem; letter-spacing: .25em;
    background: none; border: none; cursor: pointer; color: var(--muted); transition: color .3s;
  }
  .lb-btn:hover { color: var(--text); }
  .lb-close { position: absolute; top: 28px; right: 40px; }

  footer {
    border-top: 1px solid var(--line);
    padding: 32px 0 40px; font-size: .75rem; color: var(--muted); letter-spacing: .1em;
  }
  footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

  /* ===== 平板 ===== */
  @media (max-width: 960px) {
    .wrap { padding-left: 32px; padding-right: 32px; }
    .gallery { grid-template-columns: repeat(2, 1fr); gap: 64px 32px; }
    .lightbox { grid-template-columns: 1fr; grid-template-rows: 1fr auto; padding: 72px 32px 40px; gap: 28px; }
    .lb-info { text-align: center; }
    .lb-nav { justify-content: center; margin-top: 24px; }
  }
  /* ===== 手機 ===== */
  @media (max-width: 640px) {
    .wrap { padding-left: 16px; padding-right: 16px; }
    .nav { height: 68px; }
    .logo { font-size: 1.35rem; }
    .nav ul { gap: 20px; }
    .nav ul a { letter-spacing: .15em; }
    .page-head { padding-top: 40px; padding-bottom: 36px; }
    .filters { gap: 20px; margin-bottom: 48px; }
    .gallery { grid-template-columns: 1fr 1fr; gap: 44px 16px; padding-bottom: 100px; }
    .label { gap: 8px; }
    .lightbox { padding: 64px 16px 32px; }
    .lb-info .t { font-size: 1.2rem; }
    .lb-close { right: 16px; top: 18px; }
  }
</style>
</head>
<body>

<header>
  <nav class="nav wrap">
    <a href="index.html" class="logo">Niniz </a>
    <ul>
      <li><a href="works.html" class="on">作品</a></li>
      <li><a href="index.html#about">關於</a></li>
      <li><a href="index.html#contact">聯絡</a></li>
    </ul>
  </nav>
</header>

<main class="wrap">
  <div class="page-head">
    <div class="en">Works</div>
    <h1>作品</h1>
  </div>
  <div class="filters" id="filters"></div>
  <div class="gallery" id="gallery"></div>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="year"></span> Pn H</span>
    <span>所有作品版權所有，未經同意請勿轉載</span>
  </div>
</footer>

<!-- 放大檢視 -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lb-btn lb-close" id="lbClose">CLOSE ✕</button>
  <div class="lb-stage"><img id="lbImg" alt=""></div>
  <div class="lb-info">
    <div class="no" id="lbNo"></div>
    <div class="t" id="lbTitle"></div>
    <div class="m" id="lbMeta"></div>
    <div class="d" id="lbDesc"></div>
    <div class="lb-nav">
      <button class="lb-btn" id="lbPrev">← PREV</button>
      <button class="lb-btn" id="lbNext">NEXT →</button>
    </div>
  </div>
</div>

<script>
/* =====================================================
   作品清單：新增或修改作品只要改這裡！
   - src：圖片檔名（跟 index.html 放在同一層）
   - category：分類名稱，會自動變成上方的分類按鈕
   - size、desc 可以留空
   ===================================================== */
const works = [
  { src: "01.jpg", title: "海邊走走", year: 2026, medium: "壓克力", size: "15x17cm", category: "壓克力", desc: "" },
  { src: "02.jpg", title: "綠銀河",   year: 2026, medium: "壓克力", size: "15x15", category: "壓克力", desc: "" },
  { src: "03.jpg", title: "風精靈",       year: 2026, medium: "壓克力", size: "15x15", category: "壓克力", desc: "" },
  { src: "04.jpg", title: "河谷的太陽",   year: 2026, medium: "壓克力", size: "15x15", category: "壓克力", desc: "" },
  { src: "05.jpg", title: "蓮花田", year: 2026, medium: "壓克力", size: "15x15", category: "壓克力", desc: "" },
  { src: "06.jpg", title: "食人花", year: 2026, medium: "壓克力", size: "20x20", category: "壓克力", desc: "" },
  { src: "07.jpg", title: "粉橘花｜書籤", year: 2026, medium: "壓克力", size: "16x4.5", category: "壓克力", desc: "" },
  { src: "08.jpg", title: "棉花糖的天空｜書籤", year: 2026, medium: "壓克力", size: "16x4.5", category: "壓克力", desc: "" },
  { src: "09.jpg", title: "黃昏的城市｜書籤", year: 2026, medium: "壓克力", size: "16x4.5", category: "壓克力", desc: "" },
  { src: "10.jpg", title: "潮汐潮落", year: 2026, medium: "壓克力", size: "16x4.5", category: "壓克力", desc: "" },
];

/* ===== 以下是程式，不需要修改 ===== */
const gallery = document.getElementById("gallery");
const filters = document.getElementById("filters");
let current = [...works];
let index = 0;

const num = i => String(i + 1).padStart(2, "0");
const meta = w => [w.medium, w.size, w.year].filter(Boolean).join("．");

function render(list) {
  gallery.innerHTML = "";
  list.forEach((w, i) => {
    const el = document.createElement("figure");
    el.className = "item";
    el.style.animationDelay = (i % 3) * 0.12 + Math.floor(i / 3) * 0.08 + "s";
    el.innerHTML = `
      <div class="frame"><img src="${w.src}" alt="${w.title}" loading="lazy"></div>
      <figcaption class="label">
        <span class="no">${num(i)}</span>
        <span class="t">${w.title}</span>
        <span class="m">${meta(w)}</span>
      </figcaption>`;
    el.addEventListener("click", () => openLb(i));
    gallery.appendChild(el);
  });
}

function buildFilters() {
  const cats = ["全部", ...new Set(works.map(w => w.category).filter(Boolean))];
  cats.forEach((c, i) => {
    const n = c === "全部" ? works.length : works.filter(w => w.category === c).length;
    const b = document.createElement("button");
    b.innerHTML = `${c}<span class="count">(${n})</span>`;
    if (i === 0) b.classList.add("active");
    b.addEventListener("click", () => {
      filters.querySelectorAll("button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      current = c === "全部" ? [...works] : works.filter(w => w.category === c);
      render(current);
    });
    filters.appendChild(b);
  });
}

const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
function show() {
  const w = current[index];
  lbImg.src = w.src; lbImg.alt = w.title;
  document.getElementById("lbNo").textContent = num(index) + " / " + num(current.length - 1);
  document.getElementById("lbTitle").textContent = w.title;
  document.getElementById("lbMeta").textContent = meta(w);
  document.getElementById("lbDesc").textContent = w.desc || "";
}
function openLb(i) { index = i; show(); lb.classList.add("open"); document.body.style.overflow = "hidden"; }
function closeLb() { lb.classList.remove("open"); document.body.style.overflow = ""; }
function step(d) { index = (index + d + current.length) % current.length; show(); }

document.getElementById("lbClose").onclick = closeLb;
document.getElementById("lbPrev").onclick = () => step(-1);
document.getElementById("lbNext").onclick = () => step(1);
document.querySelector(".lb-stage").addEventListener("click", e => { if (e.target !== lbImg) closeLb(); });
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
// 手機左右滑動切換
let sx = null;
lb.addEventListener("touchstart", e => sx = e.touches[0].clientX, { passive: true });
lb.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
  sx = null;
});
// 簡單防止右鍵存圖
document.addEventListener("contextmenu", e => { if (e.target.tagName === "IMG") e.preventDefault(); });

document.getElementById("year").textContent = new Date().getFullYear();
buildFilters();
render(current);
</script>
</body>
</html>
